<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5問でわかる性格診断</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section id="topScreen" class="screen active">
      <h1>5問でわかる性格診断</h1>
      <p class="lead">
        かんたんな質問に答えるだけで、あなたの性格傾向を診断します。
      </p>
      <p class="top-description">
        直感で選んでください。深く考えすぎる必要はありません。
      </p>
      <div class="center">
        <button class="btn" id="startButton">診断をはじめる</button>
      </div>
      <footer>Personality Check</footer>
    </section>

    <section id="questionScreen" class="screen">
      <div class="header-info">
        <div id="questionCount" class="question-count"></div>
        <div id="timer" class="timer">経過時間: 0.000秒</div>
      </div>

      <div id="progress" class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-box">
        <h2 id="questionText"></h2>
        <div id="choices" class="choices"></div>
      </div>
    </section>

    <section id="emailScreen" class="screen">
      <h1>診断が完了しました</h1>
      <p>
        あなたの性格タイプを分析しています。<br />
        診断結果を表示するには、メールアドレスを入力してください。
      </p>

      <label for="email">メールアドレス</label>
      <input id="email" type="email" placeholder="example@example.com" />

      <p class="note">
        ※診断結果の確認用として使用します。
      </p>

      <div class="center">
        <button class="btn" id="resultButton">診断結果を見る</button>
      </div>
    </section>

    <section id="warningScreen" class="screen">
      <div class="warning">
        <h1 id="warningTitle"></h1>
        <h2 id="warningSubtitle"></h2>
        <div id="warningBody"></div>
      </div>

      <div class="fake-result">
        <h2 id="resultTitle"></h2>
        <p>
          <strong id="resultType"></strong>
        </p>
        <p id="resultDescription"></p>
      </div>

      <div class="check-card">
        <h2 id="checklistTitle"></h2>
        <ul id="checklistItems" class="checklist"></ul>
      </div>

      <div class="center">
        <button class="btn btn-secondary" id="restartButton">もう一度見る</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
